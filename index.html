<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student crud with colab</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css"
      integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div class="container-fluid p-4">
      <div class="row">
        <div class="col-md-5">
          <form id="std_form">
            <div class="card">
              <div class="card-header bg-info text-white">
                <h3>STUDENT INFORMATION</h3>
              </div>
              <div class="card-body">
                <div class="form-group">
                  <label for="fname_control">Fname</label>
                  <input class="form-control" type="text" id="fname_control" />
                </div>
                <div class="form-group">
                  <label for="lname_control">Lname</label>
                  <input class="form-control" type="text" id="lname_control" />
                </div>
                <div class="form-group">
                  <label for="email_control">Email</label>
                  <input class="form-control" type="text" id="email_control" />
                </div>
                <div class="form-group">
                  <label for="contact_control">Contact</label>
                  <input
                    class="form-control"
                    type="text"
                    id="contact_control"
                  />
                </div>
              </div>
              <div class="card-footer">
                <button class="btn btn-outline-primary btn-block">
                  Add Student
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="col-md-6">
          <table class="table table-bordered bg-white text-center">
            <thead class="bg-info">
              <tr> 
                <th> SR NO.</th>
                <th> FNAME</th>
                <th> LNAME</th>
                <th> EMAIL</th>
                <th> CONTACT</th>
                <th> EDIT</th>
                <th> REMOVE</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td> 1</td>
                <td> Naveed</td>
                <td> Chaudhary</td>
                <td> naveed@gmail.com</td>
                <td> 8329756266</td>
                <td><button class="btn btn-sm btn-primary">Edit</button></td>
                <td><button class="btn btn-sm btn-warning">Remove</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
